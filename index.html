<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Contact Cards Website</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f4f4f9;">
  <div id="root"></div>

  <!-- All React Code Inline -->
  <script type="text/babel">
    function ContactForm({ onAddContact }) {
      const [formData, setFormData] = React.useState({ name: '', email: '', phone: '', role: '' });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email) return;
        onAddContact(formData);
        setFormData({ name: '', email: '', phone: '', role: '' });
      };

      return (
        <form onSubmit={handleSubmit} style={{ background: '#fff', padding: '20px', borderRadius: '8px', marginBottom: '20px', boxShadow: '0 2px 5px rgba(0,0,0,0.1)' }}>
          <h2>Add New Contact</h2>
          <div style={{ marginBottom: '10px' }}>
            <input type="text" name="name" placeholder="Name" value={formData.name} onChange={handleChange} required style={{ width: '100%', padding: '8px', boxSizing: 'border-box' }} />
          </div>
          <div style={{ marginBottom: '10px' }}>
            <input type="email" name="email" placeholder="Email" value={formData.email} onChange={handleChange} required style={{ width: '100%', padding: '8px', boxSizing: 'border-box' }} />
          </div>
          <div style={{ marginBottom: '10px' }}>
            <input type="tel" name="phone" placeholder="Phone" value={formData.phone} onChange={handleChange} style={{ width: '100%', padding: '8px', boxSizing: 'border-box' }} />
          </div>
          <div style={{ marginBottom: '10px' }}>
            <input type="text" name="role" placeholder="Role/Title" value={formData.role} onChange={handleChange} style={{ width: '100%', padding: '8px', boxSizing: 'border-box' }} />
          </div>
          <button type="submit" style={{ padding: '10px 15px', backgroundColor: '#0066cc', color: '#fff', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>Add Contact</button>
        </form>
      );
    }

    function ContactCard({ contact }) {
      return (
        <div style={{ background: '#fff', border: '1px solid #ddd', padding: '15px', marginBottom: '10px', borderRadius: '6px', boxShadow: '0 1px 3px rgba(0,0,0,0.05)' }}>
          <h3 style={{ margin: '0 0 5px 0' }}>{contact.name}</h3>
          {contact.role && <p style={{ fontStyle: 'italic', color: '#555', margin: '0 0 5px 0' }}>{contact.role}</p>}
          <p style={{ margin: '2px 0' }}><strong>Email:</strong> {contact.email}</p>
          {contact.phone && <p style={{ margin: '2px 0' }}><strong>Phone:</strong> {contact.phone}</p>}
        </div>
      );
    }

    function UserList({ contacts }) {
      return (
        <div style={{ background: '#fff', padding: '20px', borderRadius: '8px', boxShadow: '0 2px 5px rgba(0,0,0,0.1)' }}>
          <h2>Contact List</h2>
          {contacts.length === 0 ? (
            <p>No contacts added yet.</p>
          ) : (
            contacts.map((contact, index) => (
              <ContactCard key={index} contact={contact} />
            ))
          )}
        </div>
      );
    }

    function App() {
      const [contacts, setContacts] = React.useState([
        { name: 'Brikxen Tonny', email: 'brikxen@example.com', phone: '123-456-7890', role: 'Frontend Developer' }
      ]);

      const handleAddContact = (newContact) => {
        setContacts((prev) => [...prev, newContact]);
      };

      return (
        <div style={{ maxWidth: '600px', margin: '30px auto', padding: '0 15px' }}>
          <h1 style={{ textAlign: 'center' }}>Contact Manager Website</h1>
          <ContactForm onAddContact={handleAddContact} />
          <UserList contacts={contacts} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
