<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Contact Cards Website</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px;">
  <div id="root"></div>

  <script type="text/babel">
    function ContactForm({ onAddContact }) {
      const [formData, setFormData] = React.useState({ name: '', email: '', phone: '', role: '' });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email) return;
        onAddContact(formData);
        setFormData({ name: '', email: '', phone: '', role: '' });
      };

      return (
        <form onSubmit={handleSubmit} style={{ background: '#ffffff', padding: '25px', borderRadius: '16px', marginBottom: '25px', boxShadow: '0 10px 25px rgba(0,0,0,0.15)' }}>
          <h2 style={{ margin: '0 0 20px 0', color: '#4a00e0', fontSize: '22px', borderBottom: '3px solid #ff007f', display: 'inline-block', paddingBottom: '5px' }}>Add New Contact</h2>
          <div style={{ marginBottom: '12px' }}>
            <input type="text" name="name" placeholder="Full Name" value={formData.name} onChange={handleChange} required style={{ width: '100%', padding: '12px', boxSizing: 'border-box', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', outline: 'none' }} />
          </div>
          <div style={{ marginBottom: '12px' }}>
            <input type="email" name="email" placeholder="Email Address" value={formData.email} onChange={handleChange} required style={{ width: '100%', padding: '12px', boxSizing: 'border-box', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', outline: 'none' }} />
          </div>
          <div style={{ marginBottom: '12px' }}>
            <input type="tel" name="phone" placeholder="Phone Number" value={formData.phone} onChange={handleChange} style={{ width: '100%', padding: '12px', boxSizing: 'border-box', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', outline: 'none' }} />
          </div>
          <div style={{ marginBottom: '20px' }}>
            <input type="text" name="role" placeholder="Role / Title" value={formData.role} onChange={handleChange} style={{ width: '100%', padding: '12px', boxSizing: 'border-box', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', outline: 'none' }} />
          </div>
          <button type="submit" style={{ width: '100%', padding: '12px', background: 'linear-gradient(90deg, #ff007f 0%, #7928ca 100%)', color: '#fff', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold', fontSize: '16px', boxShadow: '0 4px 12px rgba(255, 0, 127, 0.4)' }}>
            + Add Contact
          </button>
        </form>
      );
    }

    function ContactCard({ contact }) {
      const avatarLetter = contact.name ? contact.name.charAt(0).toUpperCase() : '?';

      return (
        <div style={{ background: '#ffffff', padding: '18px', marginBottom: '15px', borderRadius: '12px', boxShadow: '0 4px 12px rgba(0,0,0,0.08)', display: 'flex', alignItems: 'center', gap: '15px', borderLeft: '6px solid #ff007f' }}>
          <div style={{ width: '50px', height: '50px', borderRadius: '50%', background: 'linear-gradient(135deg, #7928ca, #ff007f)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', fontWeight: 'bold', flexShrink: 0 }}>
            {avatarLetter}
          </div>
          <div>
            <h3 style={{ margin: '0 0 4px 0', color: '#2d3748', fontSize: '18px' }}>{contact.name}</h3>
            {contact.role && <span style={{ background: '#f3e8ff', color: '#7928ca', padding: '3px 8px', borderRadius: '12px', fontSize: '12px', fontWeight: '600', display: 'inline-block', marginBottom: '6px' }}>{contact.role}</span>}
            <p style={{ margin: '2px 0', fontSize: '14px', color: '#4a5568' }}><strong>Email:</strong> {contact.email}</p>
            {contact.phone && <p style={{ margin: '2px 0', fontSize: '14px', color: '#4a5568' }}><strong>Phone:</strong> {contact.phone}</p>}
          </div>
        </div>
      );
    }

    function UserList({ contacts }) {
      return (
        <div style={{ background: '#ffffff', padding: '25px', borderRadius: '16px', boxShadow: '0 10px 25px rgba(0,0,0,0.15)' }}>
          <h2 style={{ margin: '0 0 20px 0', color: '#4a00e0', fontSize: '22px', borderBottom: '3px solid #7928ca', display: 'inline-block', paddingBottom: '5px' }}>Contact List</h2>
          {contacts.length === 0 ? (
            <p style={{ fontStyle: 'italic', color: '#a0aec0' }}>No contacts added yet.</p>
          ) : (
            contacts.map((contact, index) => (
              <ContactCard key={index} contact={contact} />
            ))
          )}
        </div>
      );
    }

    function App() {
      const [contacts, setContacts] = React.useState([
        { name: 'Brikxen Tonny', email: 'brikxen@example.com', phone: '123-456-7890', role: 'Frontend Developer' }
      ]);

      const handleAddContact = (newContact) => {
        setContacts((prev) => [...prev, newContact]);
      };

      return (
        <div style={{ maxWidth: '600px', margin: '20px auto' }}>
          <h1 style={{ textAlign: 'center', color: '#ffffff', marginBottom: '30px', fontSize: '32px', textShadow: '0 2px 4px rgba(0,0,0,0.2)' }}>
            Contact Manager
          </h1>
          <ContactForm onAddContact={handleAddContact} />
          <UserList contacts={contacts} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
